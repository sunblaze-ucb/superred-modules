[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-mt-jailbench"
version = "0.1.0"
description = "MT-JailBench evaluation as a superred SecurityClaim: the unanimous 3-judge vote (XTeaming + CoA + FITD) over the HarmBench standard behaviors"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "red-teaming",
    "ai-safety",
    "jailbreak",
    "mt-jailbench",
    "harmbench",
    "benchmark",
    "llm-judge",
    "multi-turn",
    "superred",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "superred>=0.1.0",
    "superred-target-chatbot>=0.1.0",
    "litellm>=1.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.ruff]
line-length = 100
target-version = "py312"
# _vendor/ holds MT-JailBench code pinned byte-identically; never lint it.
extend-exclude = ["src/mt_jailbench_claim/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP046/UP047 (PEP 695 generics) are ignored so the verbatim-shared
# judge_failure.py stays byte-identical across the chatbot benchmark claims.
ignore = ["UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt_jailbench_claim"]
