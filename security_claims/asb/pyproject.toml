[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-asb"
version = "0.1.0"
description = "Agent Security Bench (ASB) security claim for the ASB target: one task per (agent, benign task, attacker tool), with ASB's attack-success / utility / refusal predicates ported verbatim and hierarchical factories by scenario, aggressiveness, and attack type."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "agent-security-bench",
    "asb",
    "adversarial",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "superred>=0.1.0",
    "superred-target-asb>=0.1.0",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asb_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "faithfulness: offline faithfulness checks (no network)",
    "faithfulness_upstream: live ASB-replay vs vendored-ASB verdict comparison (credentials, cost)",
    "live: live LLM-judge checks (credentials, small cost)",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["pyopenagi.*", "aios.*"]
ignore_missing_imports = true
follow_imports = "skip"
