[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-agentharm"
version = "0.1.0"
description = "AgentHarm SecurityClaim for superred: faithful port of the harmful test_public split (176 behaviors) against the general inspect-agent target, reusing upstream inspect_evals.agentharm tools/grading/judges. 8 per-category subclaims + total."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
]
keywords = [
    "superred",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "security-claim",
    "agentharm",
    "benchmark",
]
dependencies = [
    "superred>=0.1.0",
    "superred-target-inspect-agent>=0.1.0",
    "inspect-ai>=0.3.229,<0.4",
    "inspect-evals==0.13.1",
    "huggingface-hub>=1.2",
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentharm_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "faithfulness: OUR scoring vs upstream combined_scorer (credentials, LLM cost)",
    "smoke: end-to-end claim + target via the Controller against a real model (credentials)",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]  # Generic[T] syntax requires Python 3.12+; we support 3.11

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["inspect_ai.*", "inspect_evals.*", "inspect_agent_target.*"]
ignore_missing_imports = true
