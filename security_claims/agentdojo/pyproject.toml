[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-claim-agentdojo"
version = "0.1.0"
description = "AgentDojo SecurityClaim for superred: original injection-task port + bespoke system-purpose-violation goals against the composite AgentDojoTarget"
requires-python = ">=3.11,<3.14"
dependencies = [
    "superred>=0.1.0",
    "agentdojo-target",
    "agentdojo>=0.1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/security_claim_agentdojo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: integration tests wiring Target + Optimizer + Controller",
    "smoke: end-to-end smoke tests against a real LLM (require credentials)",
]

[tool.coverage.report]
fail_under = 90

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["agentdojo.*", "agentdojo_target.*"]
ignore_missing_imports = true
