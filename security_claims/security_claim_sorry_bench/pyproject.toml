[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-claim-sorry-bench"
version = "0.1.0"
description = "SORRY-Bench safety-refusal benchmark as a superred SecurityClaim"
requires-python = ">=3.11,<3.14"
dependencies = [
    "superred>=0.1.0",
    "chatbot-target",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/security_claim_sorry_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
# `chatbot_target` does not yet ship a py.typed marker; its types are
# inspectable but mypy refuses without the marker. Skip until upstream
# adds one (parallel work — no blocker for us).
module = "chatbot_target.*"
ignore_missing_imports = true
