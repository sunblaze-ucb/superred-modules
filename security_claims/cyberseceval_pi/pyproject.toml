[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-cyberseceval-promptinjection"
version = "0.1.0"
description = "CyberSecEval textual prompt-injection benchmark as a superred SecurityClaim"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
dependencies = ["superred>=0.1.0", "superred-target-chatbot>=0.1.0", "litellm>=1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberseceval_pi_claim"]
