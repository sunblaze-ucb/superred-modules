[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-safeclawbench"
version = "0.1.0"
description = "SafeClawBench Semantic Core security claims for the OpenClaw target in superred"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "src/safeclawbench_claim/data/DATASET_LICENSE"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "superred",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "claim",
    "agent",
]
# TODO(rebase on #73): rename to "superred-target-openclaw" once this branch
# picks up the openclaw-target dist-name rename from feat/openclaw-target-migrate.
dependencies = ["superred>=0.1.0", "openclaw-target"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safeclawbench_claim"]

[tool.hatch.build.targets.wheel.force-include]
"src/safeclawbench_claim/data" = "safeclawbench_claim/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
