[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-claim-harmbench"
version = "0.1.0"
description = "HarmBench standardized red-teaming benchmark as a superred SecurityClaim"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
]
keywords = [
    "red-teaming",
    "ai-safety",
    "llm",
    "security",
    "harmbench",
    "benchmark",
    "jailbreak",
    "superred",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "superred>=0.1.0",
    # Bound to ChatbotTarget rather than Target generically: HarmBench is
    # a single-turn refusal benchmark designed for chat interfaces, with
    # no semantically meaningful interpretation against agent or RAG
    # targets.
    "superred-target-chatbot>=0.1.0",
    "litellm>=1.0",
    # Copyright matcher dependencies. spaCy >=3.8 is the first line that
    # supports Python 3.13; HarmBench upstream pins 3.7.2 but that does not
    # install on the project's 3.13 venv. en_core_web_sm 3.8.x tokenizes
    # nearly identically to 3.7.x and the 0.6 Jaccard threshold tolerates
    # small differences. datasketch is pinned to mitigate pickle-version
    # drift (the bundled .pkl reference hashes depend on the on-disk
    # MinHash representation).
    "datasketch>=1.6,<2.0",
    "spacy>=3.8,<4.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# tiktoken is preferred for accurate generation clipping when the judge
# is an OpenAI model. Falls back to a 4-chars-per-token approximation if
# unavailable.
tiktoken = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harmbench_claim"]
