[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secclaim-harmbench"
version = "0.1.0"
description = "HarmBench standardized red-teaming benchmark as a superred SecurityClaim"
requires-python = ">=3.11,<3.14"
dependencies = [
    "superred>=0.1.0",
    # Bound to ChatbotTarget rather than Target generically: HarmBench is
    # a single-turn refusal benchmark designed for chat interfaces, with
    # no semantically meaningful interpretation against agent or RAG
    # targets.
    "chatbot-target",
    "litellm>=1.0",
    # Copyright matcher dependencies. spaCy >=3.8 is the first line that
    # supports Python 3.13; HarmBench upstream pins 3.7.2 but that does not
    # install on the project's 3.13 venv. en_core_web_sm 3.8.x tokenizes
    # nearly identically to 3.7.x and the 0.6 Jaccard threshold tolerates
    # small differences. datasketch is pinned to mitigate pickle-version
    # drift (the bundled .pkl reference hashes depend on the on-disk
    # MinHash representation).
    "datasketch>=1.6,<2.0",
    "spacy>=3.8,<4.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# tiktoken is preferred for accurate generation clipping when the judge
# is an OpenAI model. Falls back to a 4-chars-per-token approximation if
# unavailable.
tiktoken = ["tiktoken>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/secclaim_harmbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/secclaim_harmbench/data" = "secclaim_harmbench/data"
