[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-agent-target"
version = "0.1.0"
description = "General inspect-ai tool-calling agent target for superred: runs an agent over caller-supplied tools/prompts/model and exposes the message trace. Benchmark-agnostic; reusable by any inspect-tool agentic SecurityClaim."
requires-python = ">=3.11,<3.14"
dependencies = [
    "superred>=0.1.0",
    "inspect-ai>=0.3.229,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "faithfulness: trace-parity vs a real inspect run (credentials, ~LLM cost)",
    "smoke: end-to-end against a real model (credentials)",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
ignore_missing_imports = true
