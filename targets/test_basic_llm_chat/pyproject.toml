[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basic-llm-chat-target"
version = "0.1.0"
description = "Single-turn LLM chat target for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0", "litellm"]

[tool.hatch.build.targets.wheel]
packages = ["src/basic_llm_chat_target"]
