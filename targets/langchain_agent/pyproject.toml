[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-langchain-agent"
version = "0.1.0"
description = "LangChain (v1) create_agent agent as a superred target: red-team a real LangChain agent graph (tool-calling loop) for prompt injection / agent misuse. Offline-testable via a scripted chat model."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" }]
keywords = ["superred", "red-teaming", "ai-safety", "security", "llm", "target", "langchain", "agent", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "langchain>=1.3,<2", "langchain-core>=1.5,<2"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real model"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langgraph.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
