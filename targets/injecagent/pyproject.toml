[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-injecagent"
version = "0.1.0"
description = "InjecAgent target: drives the agent-under-test (text ReAct or native function-calling) through one InjecAgent indirect-prompt-injection test case over a fully simulated tool environment (no Docker), running the data-stealing two-step, and captures the outputs the injecagent claim judges. Vendors InjecAgent's tool schemas and simulated-response cache."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Simon Sure", email = "info@simonsure.com" }]
keywords = ["red-teaming", "ai-safety", "security", "llm", "agent-security", "injecagent", "indirect-prompt-injection", "tool-use", "target"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "superred-claim-injecagent>=0.1.0", "litellm>=1.0"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/injecagent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Verbatim-vendored upstream prompt text (long lines + trailing whitespace kept
# byte-identical to upstream) lives under _vendor and is not linted.
extend-exclude = ["src/injecagent_target/_vendor"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
