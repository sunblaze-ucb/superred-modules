[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-minimal-llm-chat"
version = "0.1.0"
description = "Minimal single-turn LLM chat target for the superred red-teaming framework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "superred",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "target",
]
dependencies = [
    "superred>=0.1.0",
    "litellm>=1.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_llm_chat"]
