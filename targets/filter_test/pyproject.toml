[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filter-test-target"
version = "0.1.0"
description = "Deterministic multi-domain target for validating security domain filters"
requires-python = ">=3.11,<3.14"
dependencies = ["superred"]

[tool.hatch.build.targets.wheel]
packages = ["src/filter_test_target"]
