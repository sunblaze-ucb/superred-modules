[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-crewai-agent"
version = "0.1.0"
description = "A CrewAI agent/crew as a superred target: red-team a real CrewAI multi-agent crew (kickoff + tool execution) for prompt injection / agent misuse. Offline-testable via a scripted BaseLLM."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Sure", email = "info@simonsure.com" }]
keywords = ["superred", "red-teaming", "ai-safety", "security", "llm", "target", "crewai", "agent", "multi-agent", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "crewai>=1.0,<2"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real model"]
# Silence CrewAI's own internal DeprecationWarnings. The module field is an
# unanchored regex, so use `crewai\.` to match the crewai package (crewai.crew,
# crewai.agent.*) WITHOUT also matching our own crewai_agent_target.* modules.
filterwarnings = ["ignore::DeprecationWarning:crewai\\."]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["crewai.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
