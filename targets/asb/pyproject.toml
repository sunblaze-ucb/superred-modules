[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-asb"
version = "0.1.0"
description = "Agent Security Bench (ASB) composite agent target for superred: runs ASB's real plan-then-execute agent loop (vendored, pinned to upstream 1f561dcc) with event-based injection at the four ASB surfaces (DPI/OPI/PoT/MP), routed through a litellm proxy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
]
keywords = [
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "agent",
    "agent-security-bench",
    "superred",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "superred>=0.1.0",
    "litellm>=1.40",
    "pandas>=2.0",
    "openai>=1.20",
    "python-dotenv>=1.0",
    "jsonlines>=4.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asb_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The live markers cost money and need credentials. They are deselected by
# default so a plain `pytest` is always free and offline, even on a machine
# that has LITELLM_API_KEY set (which anyone running the experiments does).
# Select them explicitly with `pytest -m live`.
addopts = "--strict-markers -m 'not live and not faithfulness_upstream'"
testpaths = ["tests"]
markers = [
    "faithfulness: offline faithfulness checks (no network)",
    "live: tiny-cost real-LLM smoke via the litellm proxy (needs LITELLM_API_KEY/BASE)",
    "faithfulness_upstream: live ASB-replay vs vendored-ASB verdict comparison (credentials, cost)",
]

[tool.coverage.run]
omit = ["*/_asb_vendor/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/asb_target/_asb_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
# The vendored ASB tree is third-party code, not type-checked under strict.
exclude = ['src/asb_target/_asb_vendor/']

[[tool.mypy.overrides]]
module = ["pyopenagi.*", "aios.*"]
ignore_missing_imports = true
follow_imports = "skip"
