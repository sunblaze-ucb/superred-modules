[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-target"
version = "0.1.0"
description = "Chatbot target for superred -- wraps any LLM via litellm"
requires-python = ">=3.11,<3.14"
dependencies = ["superred", "litellm"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=chatbot_target --cov-branch --cov-report=term-missing --strict-markers"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
