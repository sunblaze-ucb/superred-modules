[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-safeclawbench-exec"
version = "0.1.0"
description = "SafeClawBench Exec-Balanced sandbox target for superred (sandbox-observed harm)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "LICENSES/SafeClawBench-MIT.txt"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "superred",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "agent",
    "target",
]
dependencies = ["superred>=0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safeclawbench_exec_target"]

[tool.hatch.build.targets.wheel.force-include]
"src/safeclawbench_exec_target/_vendor" = "safeclawbench_exec_target/_vendor"

[tool.mypy]
# Vendored upstream code (byte-for-byte; see ASSUMPTIONS.md) keeps its own
# (untyped) style; type-check only our adapter code.
[[tool.mypy.overrides]]
module = "safeclawbench_exec_target._vendor.*"
ignore_errors = true

[tool.ruff]
# Vendored upstream code (byte-for-byte; see ASSUMPTIONS.md) is not linted.
extend-exclude = ["src/safeclawbench_exec_target/_vendor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
