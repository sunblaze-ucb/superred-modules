[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-llamaindex-agent"
version = "0.1.0"
description = "A LlamaIndex ReActAgent as a superred target: red-team a real LlamaIndex agent (ReAct loop + tool execution) for prompt injection / agent misuse. Offline-testable via a scripted LLM."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" }]
keywords = ["superred", "red-teaming", "ai-safety", "security", "llm", "target", "llama-index", "agent", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "llama-index-core>=0.14,<1"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/llamaindex_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real model"]
# llama_index's pydantic-v2 models flood hundreds of upstream DeprecationWarnings
# (surfaced via pytest's own object introspection, so they can't be module-scoped).
# Ignore DeprecationWarning in this module's tests; our own source is
# deprecation-clean (enforced by mypy/ruff). This does not affect other modules.
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["llama_index.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
# demo.py's ScriptedReActLLM subclasses llama-index's CustomLLM, which mypy sees as
# ``Any`` while the framework is not installed (its import is ignored above), so
# strict's disallow_subclassing_any would flag the subclass. Relax just this offline
# test-fixture module: a no-op once llama-index is installed (CustomLLM becomes a
# real base), so it never masks a real subclassing error in the framework-present env.
module = ["llamaindex_agent_target.demo"]
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
