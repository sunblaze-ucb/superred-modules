[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtap-scaffold"
version = "0.1.0"
description = "Shared scaffolding for the DecodingTrust-Agent (DTAP) superred targets: the agent-agnostic Target base, the security-domain forest, controllables/observables, env/MCP/Docker lifecycle, and the byte-faithful judge runner."
requires-python = ">=3.11,<3.14"
dependencies = ["superred", "pyyaml", "aiohttp", "requests"]

# Optional heavier deps:
#   dataset auto-download from HuggingFace -> huggingface_hub (else use DTAP_DATASET_ROOT)
#   judge runner + harness (mcp.yaml/env.yaml, composes, run_judge, judge helpers) ->
#     decodingtrust-agent-sdk==0.2.12 (pinned, lazy-imported). Env images pull from
#     Docker Hub (decodingtrustagent/*); no local image builds for the text domains.
[project.optional-dependencies]
dataset = ["huggingface_hub>=0.20"]
# The SDK harness + the env MCP servers (run as host processes). ujson is an
# UNDECLARED runtime import of several upstream MCP servers (e.g. travel's
# mcp_server.py does `import ujson`); the SDK wheel and its extras (which are
# only agent backends) do not pull it, so it is added here. uv is the launch
# command for some servers and must be on PATH.
sdk = ["decodingtrust-agent-sdk==0.2.12", "ujson", "uv>=0.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dtap_scaffold"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not docker and not live'"
markers = [
    "docker: requires a Docker daemon + CLI (skipped offline/CI)",
    "live: requires LLM credentials via the LiteLLM proxy (LITELLM_API_KEY/BASE)",
    "faithfulness: offline byte-identity / golden-hash checks (no network)",
]

[tool.coverage.report]
fail_under = 90
