[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-target-dtap-scaffold"
version = "0.1.0"
description = "Shared scaffolding for the DecodingTrust-Agent (DTAP) superred targets: the agent-agnostic Target base, the security-domain forest, controllables/observables, env/MCP/Docker lifecycle, and the byte-faithful judge runner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
]
keywords = ["red-teaming", "ai-safety", "security", "llm", "agent", "dtap", "decodingtrust", "superred"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "pyyaml", "aiohttp"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

# Optional heavier deps:
#   judge runner + harness (mcp.yaml/env.yaml, composes, run_judge, judge helpers) ->
#     decodingtrust-agent-sdk==0.2.12 (pinned, lazy-imported). Env images pull from
#     Docker Hub (decodingtrustagent/*); no local image builds for the text domains.
# (The dataset/goal enumeration + its huggingface_hub extra live in the security
#  claim -- security_claim_dtap.dataset -- since defining the Goals is the claim's job.)
[project.optional-dependencies]
# The SDK harness + the env MCP / injection servers (run as host processes) + the
# host MCP proxy. Several upstream servers import third-party packages the SDK wheel
# and its extras (only agent backends) do NOT pull, so they are declared here (each
# was found by running the server live and reading the captured crash log):
#   - fastmcp:         EVERY env MCP + injection server (`from fastmcp import FastMCP`)
#                      and the host proxy's genuine-call/list path -> without it every
#                      env server fails readiness with ModuleNotFoundError
#   - ujson:           env MCP servers (e.g. travel mcp_server.py) + hospital injection
#   - psycopg2-binary: the customer_service injection server (env_injection.py does
#                      `import psycopg2` at module top -> crashes on launch without it)
#   - uv:              the launch command for some servers (terminal/finance) -> on PATH
# NOTE: the env servers launch via mcp.yaml's `python_executable` ("python3"), so that
# `python3` must resolve to THIS environment (activate the venv / put its bin on PATH)
# for the servers to find these deps + the SDK's dt_arena package.
sdk = ["decodingtrust-agent-sdk==0.2.12", "fastmcp", "ujson", "psycopg2-binary", "beautifulsoup4", "uv>=0.5"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dtap_scaffold"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not docker and not live'"
markers = [
    "docker: requires a Docker daemon + CLI (skipped offline/CI)",
    "live: requires LLM credentials via the LiteLLM proxy (LITELLM_API_KEY/BASE)",
    "faithfulness: offline byte-identity / golden-hash checks (no network)",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = [
    "fastmcp.*",
    "yaml",
]
ignore_missing_imports = true
