name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # Comment "@claude review" on a pull request to run this exact review again.
  # (The @claude workflow in claude.yml ignores that phrase so only this runs.)
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # No filters: every pull request is reviewed, whoever or whatever opened it.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The code-review command posts its summary with `gh pr comment`.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # A comment event checks out the default branch by default; check
          # out the pull request head instead so the review sees the PR's code.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request unconditionally. Do not stop or skip because it is AI-generated, a draft, small or "automated", or because it already has comments. The only reason to stop is that the pull request is closed.

            This is a non-interactive run: the session ends the moment you end your turn, and nothing wakes you up later. So run every subagent in the foreground and wait for its result before continuing. Never launch a subagent in the background, and never end your turn while a subagent is still running or before the review has been posted.
          # The code-review command declares these tools in its frontmatter
          # (plugins/code-review/commands/code-review.md). It reads and comments
          # on the PR through the gh CLI, and its gatekeeper subagent needs
          # `gh pr view` to decide anything at all. With only the inline-comment
          # tool granted, that first call was denied and the review silently
          # stopped while the job still reported success.
          #
          # Skill: running the /code-review:code-review slash command goes
          # through the Skill tool, which was being denied.
          # gh api: the command's subagents read PR comments with `gh api`,
          # which was also being denied.
          claude_args: '--allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'
          # Keep the transcript in the job log so a run that posts nothing can
          # be diagnosed from the log.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
