[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-optimizer-tap"
version = "0.1.0"
description = "Tree of Attacks with Pruning (TAP) optimizer for superred"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sarthak Munshi", email = "sarthakmunshi@gmail.com" },
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
dependencies = [
    "superred>=0.1.0",
    # Failure classification (retry a transient provider error, raise a
    # permanent one) needs litellm's exception classes. superred already
    # pulls litellm in; this states the direct use.
    "litellm>=1.89.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/tap_optimizer"]
