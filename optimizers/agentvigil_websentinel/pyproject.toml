[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentvigil-websentinel-optimizer"
version = "0.1.0"
description = "AgentVigil/WebSentinel indirect prompt-injection optimizer for superred agent targets"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentvigil_websentinel_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentvigil_websentinel_optimizer/data" = "agentvigil_websentinel_optimizer/data"
