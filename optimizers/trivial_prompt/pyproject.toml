[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trivial-prompt-optimizer"
version = "0.1.0"
description = "Trivial fixed-prompt-list optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred"]

[tool.hatch.build.targets.wheel]
packages = ["src/trivial_prompt_optimizer"]
