[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-passthrough-optimizer"
version = "0.1.0"
description = "Goal-passthrough (unattacked direct-prompt) baseline optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/goal_passthrough_optimizer"]
