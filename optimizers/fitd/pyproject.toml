[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitd-optimizer"
version = "0.1.0"
description = "Foot-in-the-Door multi-turn jailbreak optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fitd_optimizer"]
