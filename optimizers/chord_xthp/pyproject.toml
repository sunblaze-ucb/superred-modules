[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chord-xthp-optimizer"
version = "0.1.0"
description = "Chord/XTHP optimizer for superred agent tool-control-flow targets"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/chord_xthp_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"src/chord_xthp_optimizer/data" = "chord_xthp_optimizer/data"
