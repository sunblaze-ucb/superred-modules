[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-optimizer-mtjb-mix"
version = "0.1.0"
description = "Mix composite multi-turn jailbreak optimizer for superred (Crescendo/Actor/CoA/FITD/X-Teaming), ported from MT-JailBench"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "Rishabh Sinha", email = "rsinha17@terpmail.umd.edu" },
]
keywords = [
    "red-teaming",
    "ai-safety",
    "jailbreak",
    "mix",
    "multi-turn",
    "mt-jailbench",
    "textgrad",
    "superred",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["superred>=0.1.0", "pyyaml>=6.0", "jinja2>=3.0", "tenacity>=8.0"]

[project.optional-dependencies]
# The Mix generation/refinement path drives the vendored engine, which imports
# textgrad + tiktoken at load. Without this extra the optimizer imports but ends
# without sending (the engine cannot start).
refine = ["textgrad>=0.1.8", "tiktoken>=0.7"]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.ruff]
line-length = 100
target-version = "py312"
# _vendor/ holds MT-JailBench code pinned byte-identically; never lint it.
extend-exclude = ["src/mtjb_mix_optimizer/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mtjb_mix_optimizer"]
