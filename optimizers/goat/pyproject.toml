[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goat-optimizer"
version = "0.1.0"
description = "GOAT (Generative Offensive Agent Tester) multi-turn jailbreak optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/goat_optimizer"]
