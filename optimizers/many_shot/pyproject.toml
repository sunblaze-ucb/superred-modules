[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-optimizer-many-shot"
version = "0.1.0"
description = "Many-Shot Jailbreak single-turn optimizer for superred"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sarthak Munshi", email = "sarthakmunshi@gmail.com" },
    { name = "Simon Sure", email = "info@simonsure.com" },
]
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/many_shot_optimizer"]
