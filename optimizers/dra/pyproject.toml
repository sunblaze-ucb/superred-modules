[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dra-optimizer"
version = "0.1.0"
description = "Disguise and Reconstruction Attack (DRA) optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
detoxify = ["detoxify"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dra_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"src/dra_optimizer/data/behaviors.json" = "dra_optimizer/data/behaviors.json"
