[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-optimizer-gptfuzzer"
version = "0.1.0"
description = "GPTFuzzer jailbreak optimizer for superred"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
    { name = "Sarthak Munshi", email = "sarthakmunshi@gmail.com" },
]
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
# The RoBERTa scorer (hubert233/GPTFuzz) is the only thing here that needs a
# tensor stack, and predictor.py already treats it as optional: _ensure_loaded
# imports both lazily and turns ImportError into PredictorUnavailableError,
# whose message already says to "install the gptfuzzer optimizer with its
# roberta dependencies" -- an extra that did not exist until now. Without it
# the optimizer degrades to RefusalStringPredictor and logs a warning.
roberta = ["torch", "transformers"]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gptfuzzer_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"src/gptfuzzer_optimizer/data/GPTFuzzer.csv" = "gptfuzzer_optimizer/data/GPTFuzzer.csv"
