[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eia-agent-optimizer"
version = "0.1.0"
description = "Environmental Injection Attack optimizer for SuperRed web agents"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
    { name = "Sarthak Munshi", email = "sarthakmunshi@gmail.com" },
]
dependencies = ["superred>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
markers = [
    "live_llm: opt-in tests that call a real LLM provider",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eia_agent_optimizer"]
