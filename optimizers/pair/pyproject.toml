[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pair-optimizer"
version = "0.1.0"
description = "PAIR (Prompt Automatic Iterative Refinement) jailbreak optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred"]

[tool.hatch.build.targets.wheel]
packages = ["src/pair_optimizer"]
