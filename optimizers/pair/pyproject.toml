[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superred-optimizer-pair"
version = "0.1.0"
description = "PAIR jailbreak optimizer for superred"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "Simon Sure", email = "info@simonsure.com" },
    { name = "Sarthak Munshi", email = "sarthakmunshi@gmail.com" },
]
keywords = [
    "superred",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "optimizer",
    "jailbreak",
]
dependencies = ["superred>=0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[project.urls]
Homepage = "https://superred.simonsure.com"
Documentation = "https://superred.simonsure.com"
Repository = "https://github.com/RoldSI/superred-modules"
Issues = "https://github.com/RoldSI/superred-modules/issues"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/pair_optimizer"]
