[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muzzle-optimizer"
version = "0.1.0"
description = "MUZZLE adaptive agentic indirect-prompt-injection optimizer for superred (arXiv 2602.09222)"
requires-python = ">=3.11,<3.14"
dependencies = ["superred>=0.1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff", "types-PyYAML"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/muzzle_optimizer"]

[tool.hatch.build.targets.wheel.force-include]
"src/muzzle_optimizer/data" = "muzzle_optimizer/data"
