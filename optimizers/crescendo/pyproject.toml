[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crescendo-optimizer"
version = "0.1.0"
description = "Crescendo multi-turn jailbreak optimizer for superred"
requires-python = ">=3.11,<3.14"
dependencies = ["superred", "litellm"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/crescendo_optimizer"]
